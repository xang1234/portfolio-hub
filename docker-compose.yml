services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: portfolio-hub-ib-gateway
    restart: unless-stopped
    environment:
      TWS_USERID: ${IB_USER}
      TWS_PASSWORD: ${IB_PASS}
      TRADING_MODE: ${TRADING_MODE:-live}
      TWOFA_DEVICE: ${TWOFA_DEVICE:-mobile}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT:-yes}
      READ_ONLY_LOGIN: ${READ_ONLY_LOGIN:-yes}
      READ_ONLY_API: ${READ_ONLY_API:-yes}
      # TRUSTED_IPS is NOT an env var the gnzsnz image processes. We control
      # TrustedIPs by bind-mounting our own jts.ini.tmpl below.
      TIME_ZONE: ${TZ:-Asia/Singapore}
    volumes:
      - ib-gateway-config:/home/ibgateway/Jts
      - ./gateway/jts.ini.tmpl:/home/ibgateway/Jts/jts.ini.tmpl:ro
      - ./gateway/ibc/config.ini.tmpl:/home/ibgateway/ibc/config.ini.tmpl:ro
    # Ports are NOT published to the host. The gnzsnz image keeps Gateway's
    # native 4001/4002 ports on loopback and exposes socat forwarders on
    # 4003/4004 for other containers on the Docker network.
    expose:
      - "4003"
      - "4004"

  dashboard:
    build: .
    container_name: portfolio-hub-dashboard
    restart: unless-stopped
    environment:
      IB_HOST: ${IB_HOST:-ib-gateway}
      IB_PORT: ${IB_PORT:-4003}
      IB_CLIENT_ID: ${IB_CLIENT_ID:-1}
      BROKERS_ENABLED: ${BROKERS_ENABLED:-ibkr}
      FUTU_HOST: ${FUTU_HOST:-host.docker.internal}
      FUTU_PORT: ${FUTU_PORT:-11111}
      FUTU_MARKETS: ${FUTU_MARKETS:-HK,US,SG}
      FUTU_SECURITY_FIRM: ${FUTU_SECURITY_FIRM:-FUTUSG}
      FUTU_TRD_ENV: ${FUTU_TRD_ENV:-REAL}
      FUTU_REFRESH_CACHE: ${FUTU_REFRESH_CACHE:-false}
      FUTU_POLL_INTERVAL_S: ${FUTU_POLL_INTERVAL_S:-30}
      FUTU_ENCRYPT: ${FUTU_ENCRYPT:-}
      LONGBRIDGE_APP_KEY: ${LONGBRIDGE_APP_KEY:-}
      LONGBRIDGE_APP_SECRET: ${LONGBRIDGE_APP_SECRET:-}
      LONGBRIDGE_ACCESS_TOKEN: ${LONGBRIDGE_ACCESS_TOKEN:-}
      LONGBRIDGE_ACCOUNT_ID: ${LONGBRIDGE_ACCOUNT_ID:-Longbridge}
      LONGBRIDGE_POSITION_CHANNEL: ${LONGBRIDGE_POSITION_CHANNEL:-}
      LONGBRIDGE_BASE_CURRENCY: ${LONGBRIDGE_BASE_CURRENCY:-USD}
      LONGBRIDGE_POLL_INTERVAL_S: ${LONGBRIDGE_POLL_INTERVAL_S:-30}
      TIGER_CONFIG_DIR: ${TIGER_CONFIG_DIR:-}
      TIGER_ID: ${TIGER_ID:-}
      TIGER_ACCOUNT: ${TIGER_ACCOUNT:-}
      TIGER_PRIVATE_KEY: ${TIGER_PRIVATE_KEY:-}
      TIGER_PRIVATE_KEY_PATH: ${TIGER_PRIVATE_KEY_PATH:-}
      TIGER_BASE_CURRENCY: ${TIGER_BASE_CURRENCY:-USD}
      TIGER_MARKETS: ${TIGER_MARKETS:-US,HK,SG,AU,CN}
      TIGER_POLL_INTERVAL_S: ${TIGER_POLL_INTERVAL_S:-30}
      TZ: ${TZ:-Asia/Singapore}
    volumes:
      - ./data:/app/data
    # Bind to the loopback interface only. A bare "8080:8080" publishes on
    # 0.0.0.0 (every host interface) — which would expose full portfolio data
    # with no authentication on any reachable network. The explicit 127.0.0.1
    # prefix keeps it loopback-only; on a Tailscale-equipped host, expose it to
    # the Tailnet via `tailscale serve` rather than a public port publish.
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    depends_on:
      ib-gateway:
        condition: service_started

volumes:
  ib-gateway-config:
    name: portfolio-hub-ib-gateway-config
