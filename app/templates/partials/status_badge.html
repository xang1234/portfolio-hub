{% if state == "connected" %}
<span id="ibkr-status"
      class="status-badge status-badge--connected"
      hx-get="/healthz"
      hx-trigger="every 5s"
      hx-swap="outerHTML">🟢 IBKR connected</span>
{% elif state == "reconnecting" %}
<span id="ibkr-status"
      class="status-badge status-badge--reconnecting"
      hx-get="/healthz"
      hx-trigger="every 5s"
      hx-swap="outerHTML">🟡 IBKR reconnecting</span>
{% else %}
<span id="ibkr-status"
      class="status-badge status-badge--disconnected"
      hx-get="/healthz"
      hx-trigger="every 5s"
      hx-swap="outerHTML">🔴 IBKR disconnected</span>
{% endif %}
