{% if state == "connected" %}
<span id="ibkr-status"
      class="status-badge status-badge--connected"
      hx-get="/healthz"
      hx-trigger="every 5s"
      hx-swap="outerHTML">🟢 IBKR connected</span>
{% elif state == "reconnecting" %}
<span id="ibkr-status"
      class="status-badge status-badge--reconnecting"
      hx-get="/healthz"
      hx-trigger="every 5s"
      hx-swap="outerHTML">🟡 IBKR reconnecting{% if backoff_delay is not none %} ({{ backoff_delay|int }}s){% endif %}</span>
{% else %}
<button id="ibkr-status"
        type="button"
        class="status-badge status-badge--disconnected status-badge--retry"
        hx-post="/healthz/retry"
        hx-trigger="click"
        hx-swap="outerHTML">🔴 IBKR disconnected — click to retry</button>
{% endif %}
